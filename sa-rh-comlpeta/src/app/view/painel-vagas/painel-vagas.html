<h2>Cadastrar</h2>

<!-- formulário para mostrar a vaga selecionada ou cadastrar uma vaga nova -->

<form action="">
  <label for="">ID</label>
  <input type="text" name="id" [(ngModel)]="vaga.id">
  <br>
  <label for="">Nome</label>
  <input type="text" name="nome" [(ngModel)]="vaga.nome">
  <br>
  <label for="">Foto</label>
  <input type="text" name="foto" [(ngModel)]="vaga.foto">
  <br>
  <label for="">Descrição</label>
  <input type="text" name="descricao" [(ngModel)]="vaga.descricao">
  <br>
  <label for="">Salário</label>
  <input type="text" name="salario" [(ngModel)]="vaga.salario">
  <br>

  <button type="button" (click)="cadastrarVaga()">Cadastrar vaga</button>
  <button type="button" (click)="atualizarVaga(vaga.id)">Atualizar vaga</button>
  <button type="button" (click)="excluirVaga(vaga.id)">Excluir vaga</button>

</form>

<!-- Tabela com as vagas ja cadastradas -->

<section class="listar-vagas">
  <table class="table">
    <thead>
      <tr>
        <th>ID vaga</th>
        <th>Vaga</th>
        <th>Descrição</th>
        <th>Salário</th>
        <th>Ação</th>
     </tr>
    </thead>
    <tbody>
      @for (item of vagas; track item.id){
        <tr>
          <td>{{item.id}}</td>
          <td>{{item.nome}}</td>
          <td>{{item.descricao}}</td>
          <td>R$ {{item.salario}},00</td>
          <td>
            <button type="button" (click)="listarVagaUnica(item)">Listar</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</section>
